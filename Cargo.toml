[package]
name = "pordle"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["Parch Linux Team"]

[dependencies]
gtk = { package = "gtk4", version = "0.11" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
rusqlite = "0.31"
clap = { version = "4", features = ["derive"] }
gdk = { package = "gdk4", version = "0.11" }
glib = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

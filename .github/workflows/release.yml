name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-binary:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev

      - name: Build release binary
        run: cargo build --release

      - name: Collect assets
        run: |
          mkdir -p assets
          cp target/release/pordle assets/
          cp data/com.parchlinux.pordle.desktop assets/
          cp data/icons/com.parchlinux.pordle.svg assets/
          cp LICENSE assets/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: assets/
          if-no-files-found: error

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Generate cargo sources
        run: |
          dnf install -y python3-pip
          pip3 install flatpak-cargo-generator
          flatpak-cargo-generator Cargo.lock -o flatpak/cargo-sources.json

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: pordle.flatpak
          manifest-path: com.parchlinux.pordle.yml
          cache-key: flatpak-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: pordle.flatpak
          if-no-files-found: error

  build-arch:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Prepare Arch system
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed base-devel cargo gtk4 libadwaita sqlite

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg -s --noconfirm"

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: '*.pkg.tar.zst'
          if-no-files-found: error

  release:
    name: Create release
    needs: [build-binary, build-flatpak, build-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate release notes
        run: |
          TAG="${{ github.event.release.tag_name }}"
          cat > release-notes.md << EOF
          ## Pordle ${TAG}

          A Persian Wordle game for Parch Linux.

          Assets attached below include the Linux binary with desktop
          file and icon, a Flatpak bundle, and an Arch Linux package.
          EOF

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-binary/*
            flatpak-bundle/*
            arch-package/*
          body_path: release-notes.md
          tag_name: ${{ github.event.release.tag_name }}
